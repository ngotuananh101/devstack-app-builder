[PHP]
date.timezone=UTC
memory_limit=512M
max_execution_time=60
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL

; Launchers pass the resolved extension_dir as -d, but that argument does not
; survive a child process. A consumer that resolves the interpreter through
; PHP_BINARY runs libexec/php directly and hands its environment to the children
; it spawns, so the INI itself has to find the extensions. libexec/launch.sh
; exports DEVSTACK_PHP_ROOT; PHP expands ${VAR} here.
extension_dir = "${DEVSTACK_PHP_ROOT}/lib/php/extensions"

; Each launcher sets its own PHP_INI_SCAN_DIR; -c alone is insufficient.
