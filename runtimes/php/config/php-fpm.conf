[global]
daemonize = no
error_log = /dev/stderr

[www]
; Unix user of processes
; Note: 'group' is intentionally omitted so PHP-FPM automatically resolves the user's
; default primary group ('nogroup' on Ubuntu/Debian, 'nobody' on Alpine/RHEL).
; If running PHP-FPM as a non-root user in DevStack/containers, you can comment this line out.
user = nobody
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
