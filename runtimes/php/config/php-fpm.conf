[global]
; Example only: the launcher requires an explicit caller-owned config.
daemonize = no
error_log = /dev/stderr
; DevStack must set an absolute, per-instance pid path if needed.
; pid = /absolute/app/state/php-8.4.pid

[www]
; Non-root FPM inherits the caller's identity. No user/group or root override.
; Set a unique socket or port per PHP version/project in your own config.
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
