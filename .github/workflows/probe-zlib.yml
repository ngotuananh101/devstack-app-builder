name: Probe zlib from the runner

# Temporary diagnostic. The build job receives 12193 bytes of text/html from
# zlib.net where this workstation receives the pinned tarball, so something
# between the runner and zlib.net answers 200 with an error page. Capture what
# it actually says before changing any pin or route. Delete this file after.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Identify what answers for zlib.net
        run: |
          for u in https://zlib.net/fossils/zlib-1.3.2.tar.gz https://zlib.net/zlib-1.4.tar.gz; do
            echo "================ $u"
            curl -sS -D /tmp/h.txt -o /tmp/b.bin -L --max-time 90 "$u" || echo "curl failed: $?"
            echo "--- headers:"; cat /tmp/h.txt
            echo "--- size: $(stat -c%s /tmp/b.bin) bytes"
            echo "--- sha256: $(sha256sum /tmp/b.bin | cut -d' ' -f1)"
            echo "--- first 700 bytes of the body:"; head -c 700 /tmp/b.bin | tr -cd '[:print:]\n\t'; echo
          done

      - name: Same request through the GitHub proxy, for comparison
        run: |
          u=https://gh-proxy.org/https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          echo "== $u"
          curl -sS -D /tmp/h2.txt -o /tmp/b2.bin -L --max-time 90 "$u" || echo "curl failed: $?"
          echo "--- headers:"; cat /tmp/h2.txt
          echo "--- size: $(stat -c%s /tmp/b2.bin 2>/dev/null) bytes"
          echo "--- sha256: $(sha256sum /tmp/b2.bin 2>/dev/null | cut -d' ' -f1)"

      - name: Does the host resolve zlib.net to what we think
        run: |
          getent hosts zlib.net || true
          echo "--- dig:"; (dig +short zlib.net 2>/dev/null || echo "(no dig)")
          echo "--- curl -v head:"; curl -sv -o /dev/null --max-time 60 https://zlib.net/ 2>&1 | grep -iE "connected|subject|issuer|expire|HTTP/" | head
