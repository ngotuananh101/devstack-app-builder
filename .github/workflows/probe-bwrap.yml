name: Probe bwrap on the runner

# Temporary diagnostic. Establishes, on a real GitHub-hosted ubuntu-24.04
# runner, which restriction stops `bwrap` from creating the user namespace that
# PostgreSQL verification needs, and whether anything a workflow step may do
# lifts it. Delete this file once the answer is recorded in the docs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Baseline with the secure default
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          echo "bwrap: $(bwrap --version 2>&1)"
          echo "kernel: $(uname -r)"
          echo "restrict_userns: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          echo "shipped profiles mentioning bwrap:"
          ls -l /etc/apparmor.d/ 2>/dev/null | grep -i bwrap || echo "  (none)"
          echo "loaded profiles mentioning bwrap:"
          sudo aa-status 2>/dev/null | grep -i bwrap || echo "  (none)"
          echo "--- bwrap exit code:"
          set +e
          bwrap --dev-bind / / -- /bin/true
          echo "exit=$?"
          set -e

      - name: The real mask shape, with a path that exists
        run: |
          sudo tee /etc/apparmor.d/bwrap-userns-restrict >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap-userns-restrict /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap-userns-restrict>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          echo "restrict_userns is still: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          w=$(mktemp -d); : > "$w/empty"; mkdir -p "$w/tree"
          set +e
          echo "--- plain bind:"
          bwrap --dev-bind / / -- /bin/sh -c 'exit 0'; echo "exit=$?"
          echo "--- with a zero-byte file over an EXISTING host file (libc):"
          bwrap --dev-bind / / --ro-bind "$w/empty" /lib/x86_64-linux-gnu/libc.so.6 -- /bin/sh -c 'exit 0'; echo "exit=$?"
          echo "--- with a directory over an EXISTING host tree:"
          bwrap --dev-bind / / --ro-bind "$w/tree" /usr/lib/x86_64-linux-gnu -- /bin/sh -c 'exit 0'; echo "exit=$?"
          echo "--- masked program must now be unusable:"
          bwrap --dev-bind / / --ro-bind "$w/empty" /lib/x86_64-linux-gnu/libc.so.6 -- /bin/true; echo "exit=$? (expected nonzero)"
          rm -rf "$w"
          set -e

      - name: Nested user namespace, as bwrap needs it
        run: |
          set +e
          unshare -Ur -- /bin/sh -c 'cat /proc/self/uid_map; exit 0'; echo "unshare exit=$?"
          set -e
